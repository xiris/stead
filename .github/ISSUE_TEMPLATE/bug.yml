name: Bug report
description: Something behaves differently than the README says
labels: [bug]
body:
  - type: textarea
    id: version
    attributes:
      label: Output of `stead version`
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `stead doctor`
      description: Redact profile names if they identify a client.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The smallest way to reproduce it
